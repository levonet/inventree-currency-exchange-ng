#This file is used to package the InvenTreeCurrencyExchangeNG plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.1
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-currency-exchange-ng"
description = "Currency exchange integration"
dynamic = ["version"]
authors = [
    { name = "Pavlo Bashynskyi",email = "levonet@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    # Enter your plugin library dependencies here
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]
[project.urls]
Homepage = "https://inventree.org"

[project.entry-points."inventree_plugins"]
InvenTreeCurrencyExchangeNG = "inventree_currency_exchange_ng.core:InvenTreeCurrencyExchangeNG"

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.dynamic]
version = {attr = "inventree_currency_exchange_ng.PLUGIN_VERSION"} 

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src=["inventree_currency_exchange_ng"]

[tool.ruff.lint]

ignore = [
    "I001",
    "PIE790",
    "RUF012"
]
